name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Genereert de android/-map; bestaande lib/ en pubspec.yaml blijven staan.
      - name: Android-platform aanmaken
        run: flutter create . --platforms android --project-name printer_finder --org nl.printerfinder

      - name: Rechten toevoegen aan AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>\n    <application android:usesCleartextTraffic="true"#' $M
          sed -i 's#android:label="printer_finder"#android:label="Printer Finder"#' $M
          cat $M

      - run: flutter pub get

      - name: Code controleren
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: APK bouwen
        run: flutter build apk --release

      - name: APK hernoemen
        run: cp build/app/outputs/flutter-apk/app-release.apk printer-finder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: printer-finder-apk
          path: printer-finder.apk

      - name: Publiceren als release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Printer Finder v1.0.${{ github.run_number }}
          body: Download printer-finder.apk en installeer hem op je Android-telefoon.
          files: printer-finder.apk
          make_latest: true
